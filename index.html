<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Module Scan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Module Scan</title>
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface2:#e4e9ed; --ink:#12232e; --ink2:#52646f; --line:#c5cfd6;
  --accent:#0b5c8e; --accent-ink:#ffffff;
  --ok:#1d7a4b; --ok-bg:#dcefe4; --warn:#a85a00; --warn-bg:#fbe9cf; --bad:#b3261e; --bad-bg:#f8dcd9;
  --active:#f2b100; --active-ink:#2b2000;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1820; --surface:#15252f; --surface2:#1d3340; --ink:#e7eef2; --ink2:#9db1bd; --line:#2c4352;
    --accent:#5db4e8; --accent-ink:#06202f;
    --ok:#5fd394; --ok-bg:#13392a; --warn:#ffb454; --warn-bg:#3d2a0d; --bad:#ff8a80; --bad-bg:#40191a;
    --active:#ffc83d; --active-ink:#241a00;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
#topbar h1{font-size:1.1rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .icon{min-width:48px;min-height:48px;border:0;background:transparent;font-size:1.8rem;line-height:1;border-radius:12px}
#topbar .icon[hidden]{display:none}
#actions{display:flex;gap:6px}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 28px);max-width:640px;margin:0 auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin:0 0 4px}
.card h3{font-size:.95rem;margin:14px 0 6px}
.hint{color:var(--ink2);font-size:.9rem;margin:4px 0 8px}
.field label{display:block;font-size:.85rem;color:var(--ink2);margin:10px 0 4px}
textarea{width:100%;font:1rem/1.4 var(--mono);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:96px}
input,select{width:100%;min-height:48px;font:inherit;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input.err{border-color:var(--bad);background:var(--bad-bg)}

.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;margin-top:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:0 12px;font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.fix{flex:0 0 auto}

.strrow{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;margin-top:8px}
.strrow .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.strrow b{font-size:1.05rem}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;min-height:48px;font-size:1.5rem;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.stepper output{min-width:48px;text-align:center;font-size:1.3rem;font-weight:700}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}

.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:3px solid transparent}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.idle .aim{display:none}
.cam .aim{position:absolute;left:5%;right:5%;top:50%;border-top:2px solid var(--active);opacity:.9;pointer-events:none}
.cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfd8de;text-align:center;padding:16px}
.cam .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(0,0,0,.7);color:#fff;font-size:.9rem;min-height:40px}
.cam .msg.ok{background:rgba(20,110,60,.92)}
.cam .msg.bad{background:rgba(160,30,25,.94)}
.cam.hit{border-color:#3ddc84}
.cam.bad{border-color:#ff5a4f}
.caminfo{font-size:.8rem;color:var(--ink2);margin:4px 2px 0}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--active);color:var(--active-ink);margin:10px 0}
.banner b{font-size:1.3rem;line-height:1.15}
.banner span{font-size:.9rem;text-align:right}
.banner.done{background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok)}

.edge{font-size:.78rem;color:var(--ink2);text-align:center;margin:6px 0}
.rack{display:flex;flex-direction:column;gap:8px}
.shelf{display:block;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.shelf .lab{font-weight:700;font-size:.85rem;color:var(--ink2);padding:0 0 6px 2px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.cell{min-height:54px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cell small{font-size:.72rem;color:var(--ink2)}
.cell .sn{font-family:var(--mono);font-size:.72rem;font-weight:700}
.cell.ok{background:var(--ok-bg);border-color:var(--ok)}
.cell.flag{background:var(--warn-bg);border-color:var(--warn)}
.cell.missing{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--surface) 6px 12px);border-style:dashed}
.cell.active{outline:4px solid var(--active);outline-offset:1px;border-color:var(--active)}

#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetBg.open{display:flex}
#sheet{width:100%;max-width:640px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:90dvh;overflow:auto}
#sheet h3{margin:0 0 6px;font-size:1.1rem}
.serial{font-family:var(--mono);font-size:1.2rem;font-weight:700;margin:6px 0;word-break:break-all}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;background:#12232e;color:#fff;border-radius:12px;padding:12px 14px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#toast.show{display:block}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
th{font-size:.8rem;color:var(--ink2);font-weight:600;border-top:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
.bad{color:var(--bad)} .okc{color:var(--ok)}
details summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.foot{font-size:.85rem;color:var(--ink2);text-align:center;margin:8px 0}
.cam canvas#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;pointer-events:none;transition:opacity .1s;text-align:center;color:#fff;padding:10px}
.flash.show{opacity:1}
.flash.ok{background:rgba(18,128,66,.86)}
.flash.bad{background:rgba(190,35,30,.9)}
.flash.warn{background:rgba(185,105,0,.9)}
.flash .big{font-size:4.8rem;line-height:1;font-weight:800}
.flash .l1{font-size:1.45rem;font-weight:800;line-height:1.15}
.flash .l2{font-size:1.1rem;font-family:var(--mono);font-weight:700}
.cell.just{animation:pulse 1.1s ease-out}
@keyframes pulse{0%{background:#3ddc84;transform:scale(1.12)}100%{transform:scale(1)}}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 2px;min-height:36px;text-decoration:underline}
.roomline{font-size:.88rem;color:var(--ink2);margin:6px 2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rwrap{overflow-x:auto;padding-bottom:4px}
.rgrid{display:grid;gap:6px;align-items:stretch}
.rax{font-size:.75rem;color:var(--ink2);display:flex;align-items:center;justify-content:center;min-height:22px}
.rcell{min-height:78px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--ink2);font-size:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;position:relative;overflow:hidden}
.rcell.has{border-style:solid;background:var(--surface2);color:var(--ink);font-size:1.05rem}
.rcell.has.ok{background:var(--ok-bg);border-color:var(--ok)}
.rcell.has.prog{background:var(--warn-bg);border-color:var(--warn)}
.rcell.cur{outline:4px solid var(--active);outline-offset:1px}
.rcell small{font-size:.75rem;color:var(--ink2)}
.rcell .rn{font-size:1.35rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px;align-items:end}
.ex{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;background:var(--surface2);border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-size:.88rem;align-items:center}
.ex span{font-family:var(--mono);font-weight:700;font-size:1rem}
.ex i{color:var(--ink2);font-style:normal}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp button{min-height:54px;font-size:1.25rem;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 4px}
.kp button.act{background:var(--accent);color:var(--accent-ink);font-size:.95rem}
.kp button.emp{font-size:1.05rem}
.kp button.big{grid-column:span 3;min-height:64px;font-size:1.2rem}
.kp button.next{background:var(--accent);color:var(--accent-ink)}
.kp button.newrow{background:var(--surface2);border-color:var(--accent);color:var(--accent)}

.stepper.compact button{width:44px}
.stepper.compact output{min-width:34px}
.rcell .pb{position:absolute;left:0;bottom:0;height:5px;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="topbar">
  <button class="icon" id="back" aria-label="Back" hidden>&#8249;</button>
  <h1 id="title">Module Scan</h1>
  <div id="actions"></div>
</header>
<main id="view"></main>
<div id="sheetBg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="zxing-reader.js"></script>
<script>
(() => {
'use strict';

/* ================= constants and helpers ================= */
const KEY = 'modulescan.v1';   // old single-job storage, still read once when upgrading
const KEY2 = 'modulescan.v2';
const APP_VERSION = '1.7.0';
// Soft check only: the two known labels look like H + 3 characters + K + 13 characters (18 in total).
const SERIAL_RE = /^H[0-9A-Z]{3}K[0-9A-Z]{13}$/;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const key = (sh, m) => sh + '-' + m;
const pad2 = n => String(n).padStart(2, '0');
const localDate = d => { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const localTime = iso => { const d = new Date(iso); return localDate(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };

/* ================= state ================= */
function blank() {
  return { job: { vessel: '', project: '', system: '', engineer: '', company: '', sep: ';', startedAt: null },
           strings: [], cur: null, pos: { shelf: 1, module: 1 }, exportedAt: null, changedAt: null,
           room: { rows: 2, cols: 4, viewFrom: '', cells: {}, def: { midShelves: 5, mid: 4, bottom: 2, top: 2 } } };
}
function norm(o) {
  const b = blank(), od = (o.room && o.room.def) || {};
  const s = Object.assign(b, o, { job: Object.assign(b.job, o.job || {}), room: Object.assign(b.room, o.room || {}, { def: Object.assign(b.room.def, od) }) });
  if (od.midShelves == null && (od.shelves != null || od.mods != null || od.bottom != null)) {
    const oldDefault = (od.shelves === 4 || od.shelves == null) && [od.bottom, od.mid, od.top, od.mods].every(x => x == null || x === 6);
    s.room.def = oldDefault ? { midShelves: 5, mid: 4, bottom: 2, top: 2 } : { midShelves: Math.max(1, (od.shelves || 4) - 2), mid: od.mid || od.mods || 6, bottom: od.bottom || od.mods || 6, top: od.top || od.mods || 6 };   // older saved data
  }
  return s;
}
function loadDB() {
  const db = { systems: [], activeId: null, prefs: { res: 'high', engine: 'auto' } };
  try {
    const t = localStorage.getItem(KEY2);
    if (t) { const o = JSON.parse(t); if (o && Array.isArray(o.systems)) { db.systems = o.systems.map(s => Object.assign(norm(s), { id: s.id || uid() })); db.prefs = Object.assign(db.prefs, o.prefs || {}); return db; } }
    const t1 = localStorage.getItem(KEY);
    if (t1) { const o = JSON.parse(t1), s = norm(o); s.id = uid(); if (o.prefs) db.prefs = Object.assign(db.prefs, o.prefs); if (s.strings.length || s.job.vessel || s.job.system) db.systems.push(s); }
  } catch (e) {}
  return db;
}
let DB = loadDB();
let S = null;   // the system that is open
function activate(id) { const s = DB.systems.find(x => x.id === id); if (!s) return false; S = s; S.prefs = DB.prefs; DB.activeId = id; return true; }
let saveWarned = false;
function save(touch = true) {
  if (S && touch) S.changedAt = new Date().toISOString();
  try { localStorage.setItem(KEY2, JSON.stringify(DB, function (k, v) { return (k === 'prefs' && this !== DB) ? undefined : v; })); }
  catch (e) { if (!saveWarned) { saveWarned = true; alert('This phone cannot store the data (storage blocked or full). Export your files now.'); } }
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

const strById = id => S.strings.find(s => s.id === id);
const cur = () => strById(S.cur);
const sortedStrings = () => S.strings.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
const totalSlots = st => st.shelves.reduce((a, b) => a + b, 0);
function eachSlot(st, fn) { st.shelves.forEach((n, i) => { for (let m = 1; m <= n; m++) fn(i + 1, m, st.slots[key(i + 1, m)] || null); }); }
function counts(st) {
  let ok = 0, missing = 0, empty = 0;
  eachSlot(st, (s, m, v) => { if (!v) empty++; else if (v.status === 'ok') ok++; else missing++; });
  return { ok, missing, empty, total: ok + missing + empty };
}
function firstEmpty(st) { let r = null; eachSlot(st, (s, m, v) => { if (!v && !r) r = { shelf: s, module: m }; }); return r; }
function nextEmpty(st, from) {
  const a = []; eachSlot(st, (s, m, v) => a.push({ s, m, v }));
  const i = a.findIndex(x => x.s === from.shelf && x.m === from.module);
  for (let k = 1; k <= a.length; k++) { const x = a[(i + k) % a.length]; if (!x.v) return { shelf: x.s, module: x.m }; }
  return null;
}
function findSerial(serial, exclude) {
  for (const st of S.strings) {
    let hit = null;
    eachSlot(st, (s, m, v) => {
      if (hit || !v || v.status !== 'ok' || v.serial !== serial) return;
      if (exclude && exclude.st === st.id && exclude.s === s && exclude.m === m) return;
      hit = { st, s, m };
    });
    if (hit) return hit;
  }
  return null;
}
function cellOf(id) { for (const k in S.room.cells) if (S.room.cells[k] === id) { const [r, c] = k.split('-').map(Number); return { r, c }; } return null; }
function unplace(id) { for (const k in S.room.cells) if (S.room.cells[k] === id) delete S.room.cells[k]; }
const roomText = id => { const c = cellOf(id); return c ? 'Row ' + c.r + ' \u00b7 Column ' + c.c : ''; };
const posText = (st, s, m) => 'String ' + st.name + ' \u00b7 Shelf ' + s + ' \u00b7 Module ' + m;
function posCode(st, s, m) {
  const n = /^\d+$/.test(st.name) ? 'S' + st.name : st.name.replace(/\s+/g, '_');
  return n + '-Sh' + s + '-M' + m;
}

/* ================= view plumbing ================= */
let view = 'systems';
let draft = null;
function setBar(title, back, actions) {
  $('#title').textContent = title;
  $('#back').hidden = !back;
  $('#actions').innerHTML = actions || '';
}
function go(v, o = {}) {
  if (view === 'scan' && v !== 'scan') stopCam();
  view = v;
  if (o.replace) history.replaceState({ v }, ''); else history.pushState({ v }, '');
  render(); window.scrollTo(0, 0);
}
function render() { ({ systems: renderSystems, home: renderHome, layout: renderLayout, scan: renderScan, export: renderExport, room: renderRoom })[view](); }
history.replaceState({ v: 'systems' }, '');
window.addEventListener('popstate', e => {
  const v = (e.state && e.state.v) || 'systems';
  if (view === 'scan') stopCam();
  closeSheet();
  view = v;
  if (!S) view = 'systems';
  else {
    if (v === 'layout' && !draft) view = 'home';
    if (v === 'scan' && !cur()) view = 'home';
  }
  render(); window.scrollTo(0, 0);
});
$('#back').addEventListener('click', () => history.back());

let toastT = null;
function toast(msg, ms = 3500) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
function openSheet(html) { $('#sheet').innerHTML = html; $('#sheetBg').classList.add('open'); }
function closeSheet() { $('#sheetBg').classList.remove('open'); $('#sheet').innerHTML = ''; }
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });

/* ================= HOME ================= */
function renderHome() {
  setBar(sysTitle(S), true);
  const j = S.job;
  const strs = sortedStrings();
  $('#view').innerHTML = `
  <section class="card">
    <h2>System details</h2>
    <p class="hint">Saved on this phone. Needed for the export files. Date: ${localDate()}</p>
    <div class="field">
      <label for="j_vessel">Vessel</label><input id="j_vessel" data-job="vessel" value="${esc(j.vessel)}" autocomplete="off">
      <label for="j_project">Project</label><input id="j_project" data-job="project" value="${esc(j.project)}" autocomplete="off">
      <label for="j_system">System / BMS ID</label><input id="j_system" data-job="system" value="${esc(j.system)}" autocomplete="off">
      <label for="j_engineer">Engineer</label><input id="j_engineer" data-job="engineer" value="${esc(j.engineer)}" autocomplete="name">
      <label for="j_company">Company (optional)</label><input id="j_company" data-job="company" value="${esc(j.company)}" autocomplete="organization">
    </div>
  </section>
  <section class="card">
    <h2>Strings</h2>
    ${strs.length ? strs.map(st => {
      const c = counts(st), done = c.ok + c.missing, pct = c.total ? Math.round(done / c.total * 100) : 0;
      const chip = c.empty === 0 ? '<span class="chip ok">Complete</span>' : done ? '<span class="chip warn">In progress</span>' : '<span class="chip">Not started</span>';
      return `<button class="strrow" data-open="${st.id}"><div class="top"><b>String ${esc(st.name)}</b>${chip}</div>
        <div class="hint" style="margin:2px 0 0">${st.shelves.length} shelves \u00b7 ${c.total} modules \u00b7 ${done} done${c.missing ? ' (' + c.missing + ' missing)' : ''}</div>

    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +                                   // 0 plain
    xf(2, 2, 1, C) +                                                                                      // 1 header
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>' +                    // 2 text + border
    '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>' +      // 3 green
    '<xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>' +      // 4 amber
    '<xf numFmtId="0" fontId="0" fillId="5" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>' +      // 5 red
    '<xf numFmtId="0" fontId="0" fillId="6" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>' +      // 6 grey
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                      // 7 bold
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>' + // 8 number
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' + // 9 empty room cell
    xf(1, 3, 1, C) + xf(1, 4, 1, C) + xf(0, 6, 1, C) +                                                    // 10-12 (not used now)
    xf(3, 3, 1, C) + xf(3, 4, 1, C) + xf(3, 6, 1, C) +                                                    // 13-15 room links: green, amber, grey
    xf(0, 3, 1, C) + xf(0, 4, 1, C) + xf(0, 5, 1, C) + xf(0, 6, 1, C) +                                   // 16-19 module cells: ok, check, empty, missing
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +                      // 20 link
    '<xf numFmtId="0" fontId="3" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"/>' +      // 21 link with border
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const nRows = T.rows.length + 1, ncol = T.H.length;
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="2" firstSheet="0"/></bookViews><sheets>' +
    sheets.map((s, i) => `<sheet name="${xe(s.name)}" sheetId="${i + 1}" r:id="rId${i < 3 ? i + 1 : i + 2}"/>`).join('') + '</sheets>' +
    `<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">Modules!$A$1:$${colL(ncol - 1)}$${nRows}</definedName></definedNames></workbook>`;
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map((s, i) => `<Relationship Id="rId${i < 3 ? i + 1 : i + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
    '<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const files = [
    { name: '[Content_Types].xml', text: ct },
    { name: '_rels/.rels', text: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', text: wb },
    { name: 'xl/_rels/workbook.xml.rels', text: rels },
    { name: 'xl/styles.xml', text: styles }
  ].concat(sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, text: s.xml })));
  return zipStore(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function csvText(sep) {
  const T = tableData();
  const cell = x => { let t = String(x == null ? '' : x); if (/^[=+\-@]/.test(t)) t = "'" + t; return (t.includes(sep) || /["\n\r]/.test(t)) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return [T.H.join(sep)].concat(T.rows.map(r => r.map(cell).join(sep))).join('\r\n') + '\r\n';
}
function jsonText() {
  const j = S.job;
  return JSON.stringify({
    app: 'module-scan', appVersion: APP_VERSION, exportedAt: new Date().toISOString(),
    job: { vessel: j.vessel, project: j.project, system: j.system, engineer: j.engineer, company: j.company, startedAt: j.startedAt },
    room: { rows: S.room.rows, cols: S.room.cols, viewFrom: S.room.viewFrom, note: 'Row 1 is the top of the map, column 1 is the left.' },
    strings: sortedStrings().map(st => ({
      name: st.name, roomRow: (cellOf(st.id) || {}).r || null, roomCol: (cellOf(st.id) || {}).c || null, shelves: st.shelves,
      modules: (() => { const a = []; eachSlot(st, (s, m, v) => a.push({ shelf: s, module: m, position: posCode(st, s, m), status: !v ? 'empty' : v.status, serial: v && v.serial || null, model: v && v.model || null, rawBarcode: v && v.raw || null, barcodeFormat: v && v.format || null, entry: v && v.method || null, check: v && v.flag || null, scannedAt: v && v.at || null })); return a; })()
    }))
  }, null, 2);
}
function download(name, text, mime, bom) {
  const blob = text instanceof Blob ? text : new Blob([bom ? '\ufeff' : '', text], { type: mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function renderExport() {
  setBar('Review and export', true);
  const sts = sortedStrings();
  const bad = sts.filter(st => counts(st).empty > 0);
  const complete = sts.length > 0 && bad.length === 0 && missingJob().length === 0;
  const canShare = !!(navigator.canShare && window.File);
  const needJob = missingJob();
  $('#view').innerHTML = `
  <section class="card">
    <h2>${esc(S.job.vessel || 'Vessel')} \u00b7 ${esc(S.job.system || 'System')}</h2>
    <p class="hint">Project ${esc(S.job.project || '-')} \u00b7 ${esc(S.job.engineer || '-')} \u00b7 ${localDate()}</p>
    <table><thead><tr><th>String</th><th>Room / layout</th><th class="n">OK</th><th class="n">Missing</th><th class="n">Empty</th></tr></thead><tbody>
    ${sts.map(st => { const c = counts(st); return `<tr><td><b>${esc(st.name)}</b></td><td>${cellOf(st.id) ? 'R' + cellOf(st.id).r + ' \u00b7 C' + cellOf(st.id).c : 'not placed'}<br><span class="hint">${st.shelves.length} shelves (${st.shelves.join('/')})</span></td><td class="n okc">${c.ok}</td><td class="n">${c.missing}</td><td class="n ${c.empty ? 'bad' : ''}">${c.empty}</td></tr>`; }).join('')}
    </tbody></table>
    ${complete ? '<p class="hint okc"><b>All positions are filled or marked as missing.</b></p>' : `<p class="hint bad"><b>Not finished:</b> ${bad.map(s => 'String ' + esc(s.name) + ' (' + counts(s).empty + ' empty)').join(', ') || 'no strings yet'}.</p>`}
  </section>
  ${needJob.length ? `<section class="card"><h2>Job details needed</h2><p class="hint">Fill in to unlock the files.</p><div class="field">${needJob.map(([k, l]) => `<label for="x_${k}">${l}</label><input id="x_${k}" data-xjob="${k}" value="${esc(S.job[k])}" autocomplete="off">`).join('')}</div></section>` : ''}
  <section class="card">
    <div class="field"><label for="sep">CSV separator (use semicolon for Excel in Europe)</label>
      <select id="sep"><option value=";" ${S.job.sep === ';' ? 'selected' : ''}>Semicolon ( ; )</option><option value="," ${S.job.sep === ',' ? 'selected' : ''}>Comma ( , )</option></select></div>
    <button class="btn primary wide" id="dlXlsx" ${complete ? '' : 'disabled'}>Download Excel (.xlsx)</button>
    <button class="btn wide" id="dlCsv" ${complete ? '' : 'disabled'}>Download CSV</button>
    <button class="btn wide" id="dlJson" ${complete ? '' : 'disabled'}>Download JSON</button>
    ${canShare ? `<button class="btn wide" id="shareBoth" ${complete ? '' : 'disabled'}>Share Excel + CSV + JSON (email, Teams\u2026)</button>` : ''}
    ${!complete && sts.length && !needJob.length ? '<button class="btn wide" id="dlPartial">Export unfinished anyway</button><p class="hint">Empty positions are marked EMPTY in the file.</p>' : ''}
  </section>`;
  $$('[data-xjob]').forEach(i => { i.addEventListener('input', () => { S.job[i.dataset.xjob] = i.value; save(); }); i.addEventListener('change', () => renderExport()); });
  $('#sep').addEventListener('change', e => { S.job.sep = e.target.value; save(false); });
  const doCsv = () => { download(fileBase() + '.csv', csvText(S.job.sep), 'text/csv;charset=utf-8', true); S.exportedAt = new Date().toISOString(); save(false); };
  const doJson = () => { download(fileBase() + '.json', jsonText(), 'application/json'); S.exportedAt = new Date().toISOString(); save(false); };
  const doXlsx = () => { download(fileBase() + '.xlsx', xlsxBlob()); S.exportedAt = new Date().toISOString(); save(false); };
  const xBtn = $('#dlXlsx'); if (xBtn) xBtn.addEventListener('click', doXlsx);
  const csvBtn = $('#dlCsv'); if (csvBtn) csvBtn.addEventListener('click', doCsv);
  const jsBtn = $('#dlJson'); if (jsBtn) jsBtn.addEventListener('click', doJson);
  const sh = $('#shareBoth'); if (sh) sh.addEventListener('click', async () => {
    try {
      const files = [new File([xlsxBlob()], fileBase() + '.xlsx', { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), new File(['\ufeff' + csvText(S.job.sep)], fileBase() + '.csv', { type: 'text/csv' }), new File([jsonText()], fileBase() + '.json', { type: 'application/json' })];
      if (navigator.canShare({ files })) { await navigator.share({ files, title: 'Module scan ' + (S.job.vessel || '') }); S.exportedAt = new Date().toISOString(); save(false); }
      else toast('Sharing files is not supported here. Use Download.');
    } catch (e) { if (e && e.name !== 'AbortError') toast('Sharing failed. Use Download.'); }
  });
  const pb = $('#dlPartial'); if (pb) pb.addEventListener('click', () => { if (confirm('Some positions are still empty. Export anyway?')) { doXlsx(); setTimeout(doJson, 700); } });
}

/* ================= start ================= */
try { if (DB.systems.length && !localStorage.getItem(KEY2)) save(false); } catch (e) {}   // finish upgrading old data
render();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const flag = w => { if (navigator.serviceWorker.controller) { waitingWorker = w; updateStatus(); } };
    if (reg.waiting) flag(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') flag(w); }); });
    reg.update().catch(() => {});
    navigator.serviceWorker.ready.then(() => offlineStatus());
  }).catch(() => {});
}
window.addEventListener('online', () => view === 'systems' && offlineStatus());
window.addEventListener('offline', () => view === 'systems' && offlineStatus());
})();
</script>
</body>
</html>
